services:
  frontend:
    build:
      context: .
      target: dev
    container_name: control-escolar-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
